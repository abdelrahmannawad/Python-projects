[project]
name = "file-organizer"
version = "1.0.0"
description = "Organize files in a folder by type with dry-run and collision handling."
authors = [{ name = "Abdelrahman Awad" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
