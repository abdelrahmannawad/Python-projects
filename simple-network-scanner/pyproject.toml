[project]
name = "simple-network-scanner"
version = "1.0.0"
description = "ICMP ping sweep for a subnet with --dry-run and concurrency."
authors = [{ name = "Abdelrahman Awad" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
